# Sổ đăng ký model.
#
# NGUYÊN TẮC BẤT BIẾN: solver_* và verifier KHÔNG BAO GIỜ cùng họ model.
# Cùng model thì ta chỉ đang đo mức độ một model đồng ý với chính nó — thiên lệch
# xác nhận, không phải kiểm chứng. Đây là giả thuyết trung tâm của đề tài (ablation A3).
#
# Tên model dưới đây ĐÃ ĐƯỢC KIỂM CHỨNG trên tài khoản Groq thực tế (2026-08).
# Danh mục nhà cung cấp thay đổi liên tục — nếu gặp lỗi 404 model_not_found, chạy:
#   python scripts/check_models.py

providers:
  groq:
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
  openrouter:
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
  together:
    base_url: https://api.together.xyz/v1
    api_key_env: TOGETHER_API_KEY
  ollama:
    base_url: http://localhost:11434/v1
    api_key_env: null          # Ollama không cần key

# Giá ước tính USD / 1 triệu token — chỉ để ước lượng ngân sách, không phải hoá đơn thật.
pricing:
  "llama-3.3-70b-versatile":  { in: 0.59, out: 0.79 }
  "llama-3.1-8b-instant":     { in: 0.05, out: 0.08 }
  "openai/gpt-oss-120b":      { in: 0.15, out: 0.75 }
  "openai/gpt-oss-20b":       { in: 0.10, out: 0.50 }
  "qwen/qwen3.6-27b":         { in: 0.29, out: 0.59 }
  "_default":                 { in: 0.50, out: 1.00 }

# ---------------------------------------------------------------------------
# Ghi chú kỹ thuật: json_mode
#
# Model dòng reasoning (qwen3.6, gpt-oss-20b) phát khối suy nghĩ trước khi trả lời,
# nên Groq TỪ CHỐI (HTTP 400) khi bật response_format=json_object. Đặt json_mode: false
# cho chúng — `extract_json` trong core/llm.py tự bóc JSON khỏi <think>...</think>
# và khỏi hàng rào ```json.
# ---------------------------------------------------------------------------

profiles:

  # ---------------------------------------------------------------------------
  # MẶC ĐỊNH — họ gpt-oss GIẢI, họ Llama KIỂM TRA. Cả hai đều là model trọng số mở.
  # ---------------------------------------------------------------------------
  cloud_default:
    analyzer:         { provider: groq, model: "llama-3.1-8b-instant",     temperature: 0.0, max_tokens: 1200, json_mode: true }
    solver_math:      { provider: groq, model: "openai/gpt-oss-120b",      temperature: 0.3, max_tokens: 6000, json_mode: true, reasoning_effort: low, fallback: "groq/llama-3.3-70b-versatile" }
    solver_physics:   { provider: groq, model: "openai/gpt-oss-120b",      temperature: 0.3, max_tokens: 6000, json_mode: true, reasoning_effort: low, fallback: "groq/llama-3.3-70b-versatile" }
    solver_chemistry: { provider: groq, model: "openai/gpt-oss-120b",      temperature: 0.3, max_tokens: 6000, json_mode: true, reasoning_effort: low, fallback: "groq/llama-3.3-70b-versatile" }
    verifier:         { provider: groq, model: "llama-3.3-70b-versatile",  temperature: 0.0, max_tokens: 1800, json_mode: true, fallback: "groq/llama-3.1-8b-instant" }
    explainer:        { provider: groq, model: "llama-3.3-70b-versatile",  temperature: 0.6, max_tokens: 2500, json_mode: true, fallback: "groq/llama-3.1-8b-instant" }
    judge:            { provider: groq, model: "openai/gpt-oss-120b",      temperature: 0.0, max_tokens: 1000, json_mode: true }

  # ---------------------------------------------------------------------------
  # ABLATION A3 — verifier CÙNG họ gpt-oss với solver.
  # Dùng để chứng minh bằng số rằng khác họ tốt hơn.
  # ---------------------------------------------------------------------------
  ablation_same_family:
    analyzer:         { provider: groq, model: "llama-3.1-8b-instant",     temperature: 0.0, max_tokens: 1200, json_mode: true }
    solver_math:      { provider: groq, model: "openai/gpt-oss-120b",      temperature: 0.3, max_tokens: 6000, json_mode: true, reasoning_effort: low, fallback: "groq/llama-3.3-70b-versatile" }
    solver_physics:   { provider: groq, model: "openai/gpt-oss-120b",      temperature: 0.3, max_tokens: 6000, json_mode: true, reasoning_effort: low, fallback: "groq/llama-3.3-70b-versatile" }
    solver_chemistry: { provider: groq, model: "openai/gpt-oss-120b",      temperature: 0.3, max_tokens: 6000, json_mode: true, reasoning_effort: low, fallback: "groq/llama-3.3-70b-versatile" }
    verifier:         { provider: groq, model: "openai/gpt-oss-120b",      temperature: 0.0, max_tokens: 1800, json_mode: true, reasoning_effort: low }   # CÙNG HỌ
    explainer:        { provider: groq, model: "llama-3.3-70b-versatile",  temperature: 0.6, max_tokens: 2500, json_mode: true, fallback: "groq/llama-3.1-8b-instant" }
    judge:            { provider: groq, model: "openai/gpt-oss-120b",      temperature: 0.0, max_tokens: 1000, json_mode: true }

  # ---------------------------------------------------------------------------
  # Biến thể dùng Qwen làm Solver (model reasoning, chậm hơn nhưng mạnh về toán).
  # So sánh với cloud_default để chọn Solver tốt nhất.
  # ---------------------------------------------------------------------------
  qwen_solver:
    analyzer:         { provider: groq, model: "llama-3.1-8b-instant",     temperature: 0.0, max_tokens: 1200, json_mode: true }
    solver_math:      { provider: groq, model: "qwen/qwen3.6-27b",         temperature: 0.3, max_tokens: 4000, json_mode: false }
    solver_physics:   { provider: groq, model: "qwen/qwen3.6-27b",         temperature: 0.3, max_tokens: 4000, json_mode: false }
    solver_chemistry: { provider: groq, model: "qwen/qwen3.6-27b",         temperature: 0.3, max_tokens: 4000, json_mode: false }
    verifier:         { provider: groq, model: "llama-3.3-70b-versatile",  temperature: 0.0, max_tokens: 1800, json_mode: true, fallback: "groq/llama-3.1-8b-instant" }
    explainer:        { provider: groq, model: "llama-3.3-70b-versatile",  temperature: 0.6, max_tokens: 2500, json_mode: true, fallback: "groq/llama-3.1-8b-instant" }
    judge:            { provider: groq, model: "openai/gpt-oss-120b",      temperature: 0.0, max_tokens: 1000, json_mode: true }

  # ---------------------------------------------------------------------------
  # NHẸ — dùng khi hạn mức NGÀY của model lớn đã cạn (free tier Groq).
  # Vẫn giữ ràng buộc khác họ: gpt-oss giải, llama kiểm tra.
  #   VMA_PROFILE=groq_light python -m uvicorn vimultiagent.api.main:app --port 8000
  # ---------------------------------------------------------------------------
  groq_light:
    analyzer:         { provider: groq, model: "llama-3.1-8b-instant",  temperature: 0.0, max_tokens: 1000, json_mode: true }
    solver_math:      { provider: groq, model: "openai/gpt-oss-20b",    temperature: 0.3, max_tokens: 3500, json_mode: false, reasoning_effort: low }
    solver_physics:   { provider: groq, model: "openai/gpt-oss-20b",    temperature: 0.3, max_tokens: 3500, json_mode: false, reasoning_effort: low }
    solver_chemistry: { provider: groq, model: "openai/gpt-oss-20b",    temperature: 0.3, max_tokens: 3500, json_mode: false, reasoning_effort: low }
    verifier:         { provider: groq, model: "llama-3.1-8b-instant",  temperature: 0.0, max_tokens: 1200, json_mode: true }
    explainer:        { provider: groq, model: "llama-3.1-8b-instant",  temperature: 0.6, max_tokens: 2000, json_mode: true }
    judge:            { provider: groq, model: "openai/gpt-oss-20b",    temperature: 0.0, max_tokens: 900,  json_mode: false, reasoning_effort: low }

  # ---------------------------------------------------------------------------
  # Dự phòng offline (mất mạng lúc bảo vệ / hết quota). Chỉ nên chạy strategy=fast.
  # ---------------------------------------------------------------------------
  local_offline:
    analyzer:         { provider: ollama, model: "qwen2.5:3b-instruct-q4_K_M", temperature: 0.0, max_tokens: 900,  json_mode: true }
    solver_math:      { provider: ollama, model: "qwen2.5:3b-instruct-q4_K_M", temperature: 0.3, max_tokens: 1500, json_mode: true }
    solver_physics:   { provider: ollama, model: "qwen2.5:3b-instruct-q4_K_M", temperature: 0.3, max_tokens: 1500, json_mode: true }
    solver_chemistry: { provider: ollama, model: "qwen2.5:3b-instruct-q4_K_M", temperature: 0.3, max_tokens: 1500, json_mode: true }
    verifier:         { provider: ollama, model: "llama3.2:3b-instruct-q4_K_M", temperature: 0.0, max_tokens: 1200, json_mode: true }
    explainer:        { provider: ollama, model: "qwen2.5:3b-instruct-q4_K_M", temperature: 0.6, max_tokens: 1800, json_mode: true }
    judge:            { provider: ollama, model: "llama3.2:3b-instruct-q4_K_M", temperature: 0.0, max_tokens: 800,  json_mode: true }
